<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لمسة — متجر العناية بالبشرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Reem+Kufi:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --cream:#FAF5F0;
    --cream-2:#F2E9E1;
    --plum:#3E2634;
    --plum-2:#5A3A4C;
    --rose:#C98A9B;
    --rose-dark:#B06B7E;
    --sage:#8FA37E;
    --ink:#2B2320;
    --paper:#FFFFFF;
    --line:#E7DCD2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  #root{min-height:100vh;}

  .display{
    font-family:'Reem Kufi', 'Cairo', sans-serif;
    font-weight:400;
  }

  /* ===== NAV ===== */
  .nav{
    position:sticky; top:0; z-index:50;
    background:rgba(250,245,240,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:1180px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px;
  }
  .brand{
    font-family:'Reem Kufi', sans-serif;
    font-size:26px; color:var(--plum); letter-spacing:0.5px;
    cursor:pointer; user-select:none;
    display:flex; align-items:center; gap:8px;
  }
  .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--rose);}
  .nav-links{
    display:flex; gap:28px; list-style:none; margin:0; padding:0;
  }
  .nav-links a{
    color:var(--plum); text-decoration:none; font-size:15px; font-weight:600;
    cursor:pointer; position:relative; padding-bottom:4px;
    transition:color .2s ease;
  }
  .nav-links a:hover{color:var(--rose-dark);}
  .nav-links a::after{
    content:''; position:absolute; right:0; bottom:0; width:0; height:2px;
    background:var(--rose); transition:width .25s ease;
  }
  .nav-links a:hover::after{width:100%;}
  .cart-btn{
    display:flex; align-items:center; gap:8px;
    background:var(--plum); color:var(--cream);
    border:none; border-radius:999px; padding:10px 18px;
    font-family:'Cairo',sans-serif; font-weight:700; font-size:14px;
    cursor:pointer; transition:transform .15s ease, background .2s ease;
  }
  .cart-btn:hover{background:var(--plum-2); transform:translateY(-1px);}
  .cart-count{
    background:var(--rose); color:var(--plum); border-radius:50%;
    width:20px; height:20px; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800;
  }
  .nav-toggle{display:none; background:none; border:none; font-size:24px; color:var(--plum); cursor:pointer;}

  /* ===== HERO ===== */
  .hero{
    max-width:1180px; margin:0 auto;
    padding:72px 24px 56px;
    display:grid; grid-template-columns:1.1fr 0.9fr; gap:48px; align-items:center;
  }
  .hero-eyebrow{
    color:var(--rose-dark); font-weight:700; font-size:14px; margin-bottom:14px;
  }
  .hero h1{
    font-family:'Reem Kufi', sans-serif; font-weight:400;
    font-size:clamp(34px, 5vw, 56px); line-height:1.25; color:var(--plum);
    margin:0 0 20px;
  }
  .hero p{
    font-size:17px; line-height:1.9; color:#5b4d47; max-width:46ch; margin:0 0 28px;
  }
  .hero-actions{display:flex; gap:14px; flex-wrap:wrap;}
  .btn-primary{
    background:var(--rose); color:#fff; border:none; border-radius:10px;
    padding:14px 26px; font-family:'Cairo',sans-serif; font-weight:700; font-size:15px;
    cursor:pointer; transition:background .2s ease, transform .15s ease;
  }
  .btn-primary:hover{background:var(--rose-dark); transform:translateY(-1px);}
  .btn-ghost{
    background:transparent; color:var(--plum); border:1.5px solid var(--plum);
    border-radius:10px; padding:14px 26px; font-family:'Cairo',sans-serif; font-weight:700; font-size:15px;
    cursor:pointer; transition:all .2s ease;
  }
  .btn-ghost:hover{background:var(--plum); color:#fff;}
  .hero-visual{
    position:relative; height:380px; border-radius:24px;
    background:linear-gradient(155deg, var(--cream-2) 0%, #EADFD3 55%, var(--rose) 140%);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .hero-visual::before{
    content:'✦'; position:absolute; font-size:220px; color:rgba(255,255,255,0.45);
    font-family:serif; top:-40px; right:-30px;
  }
  .hero-jar{
    width:150px; height:170px; background:var(--paper); border-radius:20px 20px 34px 34px;
    box-shadow:0 30px 60px -20px rgba(62,38,52,0.35); position:relative; z-index:2;
  }
  .hero-jar::before{
    content:''; position:absolute; top:-18px; left:50%; transform:translateX(-50%);
    width:96px; height:26px; background:var(--sage); border-radius:10px;
  }
  .hero-jar::after{
    content:'لمسة'; position:absolute; bottom:22px; left:0; right:0; text-align:center;
    font-family:'Reem Kufi',sans-serif; color:var(--plum); font-size:20px;
  }

  /* ===== CATEGORY QUICK NAV ===== */
  .cat-strip{
    max-width:1180px; margin:0 auto; padding:0 24px 40px;
    display:flex; gap:12px; flex-wrap:wrap;
  }
  .cat-chip{
    border:1.5px solid var(--line); background:var(--paper); color:var(--plum);
    padding:9px 18px; border-radius:999px; font-size:14px; font-weight:600;
    cursor:pointer; transition:all .2s ease;
  }
  .cat-chip.active, .cat-chip:hover{
    background:var(--plum); border-color:var(--plum); color:var(--cream);
  }

  /* ===== SECTIONS ===== */
  .section{
    max-width:1180px; margin:0 auto; padding:54px 24px;
    border-top:1px solid var(--line);
  }
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:30px; gap:20px; flex-wrap:wrap;
  }
  .section-head h2{
    font-family:'Reem Kufi', sans-serif; font-weight:400;
    font-size:32px; color:var(--plum); margin:0;
    display:flex; align-items:center; gap:12px;
  }
  .section-tag{
    width:10px; height:10px; border-radius:3px; display:inline-block;
  }
  .section-desc{color:#7a6b64; font-size:14.5px; max-width:52ch; margin:6px 0 0;}
  .section-count{color:#a3948d; font-size:14px; font-weight:600; white-space:nowrap;}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:22px;
  }

  .card{
    background:var(--paper); border-radius:16px; overflow:hidden;
    border:1px solid var(--line);
    display:flex; flex-direction:column;
    transition:transform .22s ease, box-shadow .22s ease;
  }
  .card:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 34px -18px rgba(62,38,52,0.3);
  }
  .card-media{
    height:170px; position:relative;
    display:flex; align-items:center; justify-content:center;
    font-size:40px;
  }
  .card-body{padding:16px 16px 18px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .card-name{font-weight:700; font-size:15.5px; color:var(--plum); margin:0;}
  .card-desc{font-size:13px; color:#8b7c74; line-height:1.6; margin:0; min-height:36px;}
  .card-foot{
    margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .card-price{font-weight:800; color:var(--ink); font-size:15px;}
  .add-btn{
    border:none; background:var(--cream-2); color:var(--plum);
    border-radius:9px; padding:9px 14px; font-weight:700; font-size:13px;
    cursor:pointer; transition:background .2s ease, color .2s ease;
    display:flex; align-items:center; gap:6px;
  }
  .add-btn:hover{background:var(--rose); color:#fff;}
  .add-btn.added{background:var(--sage); color:#fff;}

  /* ===== CART DRAWER ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(43,35,32,0.4);
    z-index:90; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; bottom:0; left:0; width:min(380px, 92vw);
    background:var(--cream); z-index:91;
    transform:translateX(-100%); transition:transform .3s ease;
    display:flex; flex-direction:column;
    box-shadow:20px 0 50px rgba(0,0,0,0.15);
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    padding:22px 22px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .drawer-head h3{font-family:'Reem Kufi',sans-serif; font-weight:400; color:var(--plum); font-size:22px; margin:0;}
  .drawer-close{background:none; border:none; font-size:22px; color:var(--plum); cursor:pointer;}
  .drawer-list{flex:1; overflow-y:auto; padding:16px 22px;}
  .drawer-item{
    display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);
    align-items:center;
  }
  .drawer-item-icon{
    width:52px; height:52px; border-radius:10px; background:var(--cream-2);
    display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
  }
  .drawer-item-info{flex:1;}
  .drawer-item-info .name{font-weight:700; font-size:14px; color:var(--plum);}
  .drawer-item-info .meta{font-size:12.5px; color:#9a8c84; margin-top:2px;}
  .qty-controls{display:flex; align-items:center; gap:8px;}
  .qty-btn{
    width:24px; height:24px; border-radius:6px; border:1px solid var(--line);
    background:#fff; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;
    color:var(--plum);
  }
  .empty-cart{
    text-align:center; color:#a3948d; padding:60px 20px; font-size:14px;
  }
  .drawer-foot{
    padding:18px 22px 24px; border-top:1px solid var(--line);
  }
  .drawer-total{
    display:flex; justify-content:space-between; font-weight:800; color:var(--plum);
    font-size:17px; margin-bottom:14px;
  }
  .checkout-btn{
    width:100%; background:var(--plum); color:var(--cream); border:none;
    border-radius:10px; padding:14px; font-weight:700; font-size:15px; cursor:pointer;
    transition:background .2s ease;
  }
  .checkout-btn:hover{background:var(--plum-2);}

  .footer{
    text-align:center; padding:40px 24px 50px; color:#a3948d; font-size:13px;
  }

  .page-head{
    max-width:1180px; margin:0 auto; padding:28px 24px 0;
  }
  .back-btn{
    background:var(--paper); color:var(--plum); border:1.5px solid var(--line);
    border-radius:999px; padding:9px 20px; font-family:'Cairo',sans-serif;
    font-weight:700; font-size:14px; cursor:pointer; transition:all .2s ease;
  }
  .back-btn:hover{background:var(--plum); border-color:var(--plum); color:var(--cream);}

  /* ===== ADMIN ===== */
  .admin-link{margin-top:10px;}
  .admin-link a{color:#c7bab2; font-size:12px; text-decoration:underline;}
  .admin-link a:hover{color:var(--plum);}

  .admin-gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--cream); padding:24px;
  }
  .admin-gate-box{
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:32px; width:100%; max-width:360px; text-align:center;
    display:flex; flex-direction:column; gap:14px;
  }
  .admin-gate-box h2{font-family:'Reem Kufi',sans-serif; font-weight:400; color:var(--plum); margin:0 0 6px;}
  .admin-gate-box input{
    padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    font-family:inherit; font-size:15px; text-align:center;
  }

  .admin-page{max-width:760px; margin:0 auto; padding:36px 24px 60px;}
  .admin-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:26px; gap:16px; flex-wrap:wrap;
  }
  .admin-head h2{font-size:26px; color:var(--plum); margin:0;}
  .admin-form{
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:24px; display:flex; flex-direction:column; gap:14px; margin-bottom:34px;
  }
  .admin-form h3{margin:0 0 4px; color:var(--plum); font-size:17px;}
  .admin-form label{
    display:flex; flex-direction:column; gap:6px; font-size:13.5px; font-weight:700; color:var(--plum);
  }
  .admin-form input, .admin-form select, .admin-form textarea{
    padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    font-family:inherit; font-size:14px; font-weight:400; color:var(--ink); resize:vertical;
  }
  .admin-status{font-size:13.5px; font-weight:700; margin:0; color:var(--plum);}
  .admin-status.success{color:var(--sage);}
  .admin-status.error{color:var(--rose-dark);}

  .admin-list-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; gap:12px; flex-wrap:wrap;
  }
  .admin-list-head h3{margin:0; color:var(--plum); font-size:17px;}
  .admin-item{
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .admin-item-info strong{color:var(--plum); font-size:14.5px;}
  .admin-item-price{color:var(--ink); font-weight:700; font-size:13px; margin-right:8px;}
  .admin-item-desc{color:#8b7c74; font-size:12.5px; margin:4px 0 0;}
  .delete-btn{
    background:none; border:1.5px solid var(--rose-dark); color:var(--rose-dark);
    border-radius:8px; padding:7px 14px; font-weight:700; font-size:12.5px;
    cursor:pointer; transition:all .2s ease; flex-shrink:0;
  }
  .delete-btn:hover{background:var(--rose-dark); color:#fff;}

  @media (max-width:820px){
    .hero{grid-template-columns:1fr; padding-top:40px;}
    .hero-visual{height:260px; order:-1;}
    .nav-links{
      position:fixed; top:64px; right:0; left:0; background:var(--cream);
      flex-direction:column; padding:18px 24px; gap:16px;
      border-bottom:1px solid var(--line);
      transform:translateY(-130%); transition:transform .25s ease;
      z-index:49;
    }
    .nav-links.open{transform:translateY(0);}
    .nav-toggle{display:block;}
  }
</style>
</head>

const { useState, useMemo, useRef, useEffect } = React;

            {cartCount > 0 && <span className="cart-count">{cartCount}</span>}
          </button>
          <button className="nav-toggle" onClick={() => setOpen(o=>!o)}>☰</button>
        </div>
      </div>
    </div>
  );
}

function ProductCard({ product, category, onAdd, justAdded }){
  return (
    <div className="card">
      <div className="card-media" style={{background: category.color + "22"}}>
        {product.imageUrl
          ? <img src={product.imageUrl} alt={product.name} onError={(e) => { e.target.style.display = "none"; }} />
          : <span>{category.icon}</span>}
      </div>
      <div className="card-body">
        <p className="card-name">{product.name}</p>
        <p className="card-desc">{product.desc}</p>
        <div className="card-foot">
          <span className="card-price">{currency(product.price)}</span>
          <button
            className={"add-btn" + (justAdded ? " added" : "")}
            onClick={() => onAdd(product)}
          >
            {justAdded ? "✓ أُضيف" : "+ أضف للسلة"}
          </button>
        </div>
      </div>
    </div>
  );
}

function CategorySection({ category, products, onAdd, justAddedId }){
  return (
    <div className="section" id={category.id}>
      <div className="section-head">
        <div>
          <h2>
            <span className="section-tag" style={{background: category.color}}></span>
            {category.name}
          </h2>
          <p className="section-desc">{category.desc}</p>
        </div>
        <span className="section-count">{products.length} منتج</span>
      </div>
      {products.length === 0 ? (
        <p style={{color:"#a3948d", fontSize:14}}>لا توجد منتجات في هذا القسم حالياً.</p>
      ) : (
        <div className="grid">
          {products.map(p => (
            <ProductCard
              key={p.id}
              product={p}
              category={category}
              onAdd={onAdd}
              justAdded={justAddedId === p.id}
            />
          ))}
        </div>
      )}
    </div>
  );
}

/* FIX: added `onCheckout` to the destructured props — it was missing,
   which meant the checkout button's onClick handler was always undefined. */
function CartDrawer({ open, onClose, items, onQtyChange, onRemove, onCheckout }){
  const [governorate, setGovernorate] = useState(GOVERNORATES[0]);
  const [phone, setPhone] = useState("");
  const [area, setArea] = useState("");
  const [error, setError] = useState("");

  const subtotal = items.reduce((sum, it) => sum + it.price * it.qty, 0);
  const total = subtotal + (items.length > 0 ? DELIVERY_FEE : 0);

  const handleCheckoutClick = () => {
    if (!phone.trim() || !area.trim()) {
      setError("يرجى إدخال رقم الهاتف والمنطقة قبل إتمام الشراء");
      return;
    }
    setError("");
    onCheckout({ governorate, phone: phone.trim(), area: area.trim(), deliveryFee: DELIVERY_FEE, subtotal, total });
  };

  return (
    <React.Fragment>
      <div className={"overlay" + (open ? " open" : "")} onClick={onClose}></div>
      <div className={"drawer" + (open ? " open" : "")}>
        <div className="drawer-head">
          <h3>سلة التسوق</h3>
          <button className="drawer-close" onClick={onClose}>✕</button>
        </div>
        <div className="drawer-list">
          {items.length === 0 && (
            <div className="empty-cart">السلة فارغة — أضف منتجاً لتبدأ التسوق</div>
          )}
          {items.map(it => (
            <div className="drawer-item" key={it.id}>
              <div className="drawer-item-icon">{it.icon}</div>
              <div className="drawer-item-info">
                <div className="name">{it.name}</div>
                <div className="meta">{currency(it.price)}</div>
              </div>
              <div className="qty-controls">
                <button className="qty-btn" onClick={() => onQtyChange(it.id, it.qty - 1)}>−</button>
                <span>{it.qty}</span>
                <button className="qty-btn" onClick={() => onQtyChange(it.id, it.qty + 1)}>+</button>
              </div>
            </div>
          ))}
        </div>
        {items.length > 0 && (
          <div className="drawer-foot">
            <div className="delivery-info" style={{display:"flex", flexDirection:"column", gap:10, marginBottom:14}}>
              <label style={{fontSize:13, fontWeight:700, color:"var(--plum)"}}>
                المحافظة
                <select
                  value={governorate}
                  onChange={(e) => setGovernorate(e.target.value)}
                  style={{width:"100%", marginTop:4, padding:"8px 10px", borderRadius:8, border:"1px solid var(--line)", fontFamily:"inherit"}}
                >
                  {GOVERNORATES.map(g => <option key={g} value={g}>{g}</option>)}
                </select>
              </label>
              <div style={{position:"relative"}}>
                <input
                  type="tel"
                  placeholder="رقم الهاتف"
                  value={phone}
                  onChange={(e) => setPhone(e.target.value)}
                  style={{width:"100%", padding:"10px 34px 10px 12px", borderRadius:8, border: "1px solid " + (phone.trim() === "" ? "var(--rose-dark)" : "var(--line)"), fontFamily:"inherit", fontSize:14}}
                />
                {phone.trim() === "" && (
                  <span style={{position:"absolute", top:"50%", left:10, transform:"translateY(-50%)", color:"var(--rose-dark)", fontWeight:800}}>!</span>
                )}
              </div>
              <div style={{position:"relative"}}>
                <input
                  type="text"
                  placeholder="المنطقة"
                  value={area}
                  onChange={(e) => setArea(e.target.value)}
                  style={{width:"100%", padding:"10px 34px 10px 12px", borderRadius:8, border: "1px solid " + (area.trim() === "" ? "var(--rose-dark)" : "var(--line)"), fontFamily:"inherit", fontSize:14}}
                />
                {area.trim() === "" && (
                  <span style={{position:"absolute", top:"50%", left:10, transform:"translateY(-50%)", color:"var(--rose-dark)", fontWeight:800}}>!</span>
                )}
              </div>
              {error && <p style={{color:"var(--rose-dark)", fontSize:12.5, margin:0}}>{error}</p>}
            </div>
            <div className="drawer-total" style={{flexDirection:"column", gap:4, alignItems:"stretch"}}>
              <div style={{display:"flex", justifyContent:"space-between", fontWeight:600, fontSize:14}}>
                <span>المجموع الفرعي</span><span>{currency(subtotal)}</span>
              </div>
              <div style={{display:"flex", justifyContent:"space-between", fontWeight:600, fontSize:14}}>
                <span>التوصيل</span><span>{currency(DELIVERY_FEE)}</span>
              </div>
              <div style={{display:"flex", justifyContent:"space-between", fontWeight:800, fontSize:17, marginTop:4}}>
                <span>الإجمالي</span><span>{currency(total)}</span>
              </div>
            </div>
            <button className="checkout-btn" onClick={handleCheckoutClick} style={{marginTop:14}}>إتمام الشراء</button>
          </div>
        )}
      </div>
    </React.Fragment>
  );
}

// ===== حماية بسيطة بكلمة مرور للوصول للوحة الإدارة =====
// ملاحظة: هذه حماية بسيطة من جهة المتصفح فقط للاستخدام اليومي، وليست حماية أمنية حقيقية.
// أي شخص يعرف كيف يقرأ كود الصفحة يمكنه رؤية كلمة المرور. للحماية الحقيقية لاحقاً
// يفضّل استخدام Firebase Authentication + قواعد أمان Firestore تمنع الكتابة إلا لحساب مسجّل دخول.
const ADMIN_PASSWORD = "لمسة2026";

function AdminGate({ children }){
  const [unlocked, setUnlocked] = useState(false);
  const [pass, setPass] = useState("");
  const [err, setErr] = useState("");

  const handleSubmit = (e) => {
    e.preventDefault();
    if (pass === ADMIN_PASSWORD) { setUnlocked(true); setErr(""); }
    else setErr("كلمة المرور غير صحيحة");
  };

  if (unlocked) return children;

  return (
    <div className="admin-gate">
      <form className="admin-gate-box" onSubmit={handleSubmit}>
        <h2>دخول لوحة إدارة المتجر</h2>
        <input
          type="password"
          placeholder="كلمة المرور"
          value={pass}
          onChange={(e) => setPass(e.target.value)}
          autoFocus
        />
        <button type="submit" className="btn-primary">دخول</button>
        {err && <p className="admin-status error">{err}</p>}
      </form>
    </div>
  );
}

function AdminPage({ categories, onBack }){
  const [products, setProducts] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [name, setName] = useState("");
  const [imageUrl, setImageUrl] = useState("");
  const [price, setPrice] = useState("");
  const [desc, setDesc] = useState("");
  const [cat, setCat] = useState(categories[0].id);
  const [status, setStatus] = useState("");
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    const unsub = db.collection("products").onSnapshot(
      (snapshot) => {
        setProducts(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
        setLoaded(true);
      },
      (error) => {
        console.error("فشل جلب المنتجات:", error);
        setStatus("❌ تعذر الاتصال بقاعدة البيانات: " + error.message);
        setLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  const resetForm = () => { setName(""); setImageUrl(""); setPrice(""); setDesc(""); };

  const handleAdd = async (e) => {
    e.preventDefault();
    if (!name.trim() || !price || Number(price) <= 0 || !desc.trim()) {
      setStatus("⚠️ يرجى تعبئة كل الحقول بشكل صحيح (السعر يجب أن يكون رقماً أكبر من صفر)");
      return;
    }
    setSaving(true);
    try {
      await db.collection("products").add({
        name: name.trim(),
        imageUrl: imageUrl.trim() || null,
        price: Number(price),
        desc: desc.trim(),
        cat,
        createdAt: new Date().toISOString(),
      });
      setStatus("✅ تمت إضافة المنتج، وسيظهر في الموقع تلقائياً الآن");
      resetForm();
    } catch (error) {
      setStatus("❌ فشلت الإضافة: " + error.message);
    }
    setSaving(false);
  };

  const handleDelete = async (id) => {
    if (!window.confirm("هل أنتِ متأكدة من حذف هذا المنتج نهائياً؟")) return;
    try {
      await db.collection("products").doc(id).delete();
    } catch (error) {
      alert("تعذر الحذف: " + error.message);
    }
  };

  const handleSeed = async () => {
    if (!window.confirm("سيتم استيراد " + SEED_PRODUCTS.length + " منتجاً افتراضياً إلى المتجر. متابعة؟")) return;
    setStatus("⏳ جاري الاستيراد...");
    try {
      const batch = db.batch();
      SEED_PRODUCTS.forEach(p => {
        const ref = db.collection("products").doc();
        batch.set(ref, { ...p, createdAt: new Date().toISOString() });
      });
      await batch.commit();
      setStatus("✅ تم استيراد المنتجات الافتراضية بنجاح");
    } catch (error) {
      setStatus("❌ فشل الاستيراد: " + error.message);
    }
  };

  return (
    <div className="admin-page">
      <div className="admin-head">
        <h2 className="display">لوحة إدارة المنتجات</h2>
        <button className="back-btn" onClick={onBack}>→ العودة للمتجر</button>
      </div>

      <form className="admin-form" onSubmit={handleAdd}>
        <h3>إضافة منتج جديد</h3>
        <label>
          اسم المنتج
          <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="مثال: غسول الورد المهدئ" />
        </label>
        <label>
          السعر (بالدينار العراقي)
          <input type="number" min="0" value={price} onChange={(e) => setPrice(e.target.value)} placeholder="مثال: 15000" />
        </label>
        <label>
          الوصف
          <textarea rows="2" value={desc} onChange={(e) => setDesc(e.target.value)} placeholder="وصف قصير للمنتج"></textarea>
        </label>
        <label>
          القسم
          <select value={cat} onChange={(e) => setCat(e.target.value)}>
            {categories.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
          </select>
        </label>
        <button type="submit" className="btn-primary" disabled={saving}>
          {saving ? "جاري الحفظ..." : "إضافة المنتج"}
        </button>
        {status && <p className={"admin-status" + (status.startsWith("✅") ? " success" : status.startsWith("⚠️") ? "" : " error")}>{status}</p>}
      </form>

      <div className="admin-list">
        <div className="admin-list-head">
          <h3>المنتجات الحالية ({products.length})</h3>
          {loaded && products.length === 0 && (
            <button className="btn-ghost" onClick={handleSeed}>استيراد المنتجات الافتراضية</button>
          )}
        </div>
        {!loaded && <p style={{color:"#a3948d"}}>جاري تحميل المنتجات...</p>}
        {loaded && products.length === 0 && (
          <p style={{color:"#a3948d"}}>لا توجد منتجات بعد. أضيفي منتجك الأول من النموذج أعلاه، أو استوردي المنتجات الافتراضية.</p>
        )}
        {products.map(p => {
          const category = categories.find(c => c.id === p.cat);
          return (
            <div className="admin-item" key={p.id}>
              <div className="admin-item-info">
                <strong>{category ? category.icon : ""} {p.name}</strong>
                <span className="admin-item-price">{p.price != null ? p.price.toLocaleString("en-US") + " IQD" : ""}</span>
                <p className="admin-item-desc">{p.desc}</p>
              </div>
              <button className="delete-btn" onClick={() => handleDelete(p.id)}>حذف</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Store(){
  const [cart, setCart] = useState({});
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [justAddedId, setJustAddedId] = useState(null);
  const flashTimer = useRef(null);

  const [products, setProducts] = useState([]);
  const [productsLoaded, setProductsLoaded] = useState(false);

  useEffect(() => {
    const unsub = db.collection("products").onSnapshot(
      (snapshot) => {
        setProducts(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
        setProductsLoaded(true);
      },
      (error) => {
        console.error("فشل جلب المنتجات من Firestore:", error);
        setProductsLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  const catById = useMemo(() => {
    const m = {};
    CATEGORIES.forEach(c => m[c.id] = c);
    return m;
  }, []);

  const addToCart = (product) => {
    setCart(prev => {
      const existing = prev[product.id];
      const qty = existing ? existing.qty + 1 : 1;
      return { ...prev, [product.id]: { ...product, qty, icon: catById[product.cat].icon } };
    });
    setJustAddedId(product.id);
    if (flashTimer.current) clearTimeout(flashTimer.current);
    flashTimer.current = setTimeout(() => setJustAddedId(null), 900);
  };

  const changeQty = (id, qty) => {
    setCart(prev => {
      if (qty <= 0) {
        const next = { ...prev };
        delete next[id];
        return next;
      }
      return { ...prev, [id]: { ...prev[id], qty } };
    });
  };

  /* FIX: this function was previously defined *inside* addToCart, so it
     never existed in App's scope and calling it threw "sendToWhatsApp is
     not defined". It also used object/foreach/encodeuricomponent instead
     of the correctly-capitalized Object/forEach/encodeURIComponent. */
  const sendToWhatsApp = (delivery) => {
    const items = Object.values(cart);
    if (items.length === 0) return;
    let message = "تفاصيل الطلب:\n";
    items.forEach(item => {
      message += item.name + ": " + item.qty + " × " + currency(item.price) + "\n";
    });
    message += "\nالمجموع الفرعي: " + currency(delivery.subtotal);
    message += "\nالتوصيل: " + currency(delivery.deliveryFee);
    message += "\nالإجمالي: " + currency(delivery.total);
    message += "\n\nالمحافظة: " + delivery.governorate;
    message += "\nالمنطقة: " + delivery.area;
    message += "\nرقم الهاتف: " + delivery.phone;
    window.open("https://wa.me/9647869367775?text=" + encodeURIComponent(message), "_blank");
  };

  const cartItems = Object.values(cart);
  const cartCount = cartItems.reduce((s, it) => s + it.qty, 0);

  const [activePage, setActivePage] = useState(null); // null = الصفحة الرئيسية، أو معرّف القسم

  const goTo = (id) => {
    window.scrollTo({ top: 0, behavior: "auto" });
    if (id === "top") { setActivePage(null); return; }
    setActivePage(id);
  };

  return (
    <React.Fragment>
      <Nav cartCount={cartCount} onCartClick={() => setDrawerOpen(true)} onNavClick={goTo} />

      {activePage === null ? (
        <React.Fragment>
          <div className="hero">
            <div>
              <div className="hero-eyebrow">عناية يومية بالبشرة</div>
              <h1 className="display">جمالك يبدأ بروتين بسيط، يُصنع بعناية</h1>
              <p>مجموعة مختارة من الغسولات والكريمات والسيرومات، مصممة لتناسب كل نوع بشرة — بمكونات واضحة ونتائج نلمسها.</p>
              <div className="hero-actions">
                <button className="btn-primary" onClick={() => goTo("cleansers")}>تسوقي الآن</button>
                <button className="btn-ghost" onClick={() => goTo("serums")}>اكتشفي السيروم</button>
              </div>
            </div>
            <div className="hero-visual">
              <div className="hero-jar"></div>
            </div>
          </div>

          <div className="cat-strip">
            {CATEGORIES.map(c => (
              <button key={c.id} className="cat-chip" onClick={() => goTo(c.id)}>
                {c.icon} {c.name}
              </button>
            ))}
          </div>
        </React.Fragment>
      ) : (
        <div className="page-head">
          <button className="back-btn" onClick={() => goTo("top")}>→ الرئيسية</button>
        </div>
      )}

      {activePage === null && productsLoaded && products.length === 0 && (
        <p style={{textAlign:"center", color:"#a3948d", padding:"20px 24px"}}>
          المتجر قيد التجهيز حالياً، تابعينا قريباً لمنتجات جديدة.
        </p>
      )}

      {CATEGORIES
        .filter(cat => activePage === null || activePage === cat.id)
        .map(cat => (
          <CategorySection
            key={cat.id}
            category={cat}
            products={products.filter(p => p.cat === cat.id)}
            onAdd={addToCart}
            justAddedId={justAddedId}
          />
        ))}

      <div className="footer">
        لمسة © 2026 — جميع الحقوق محفوظة
        <div className="admin-link"><a href="#admin">إدارة المنتجات</a></div>
      </div>

      <CartDrawer
        open={drawerOpen}
        onClose={() => setDrawerOpen(false)}
        items={cartItems}
        onQtyChange={changeQty}
        onCheckout={sendToWhatsApp}
        onRemove={(id) => changeQty(id, 0)}
      />
    </React.Fragment>
  );
}

function Root(){
  const [route, setRoute] = useState(() => window.location.hash === "#admin" ? "admin" : "store");

  useEffect(() => {
    const onHashChange = () => setRoute(window.location.hash === "#admin" ? "admin" : "store");
    window.addEventListener("hashchange", onHashChange);
    return () => window.removeEventListener("hashchange", onHashChange);
  }, []);

  if (route === "admin") {
    return (
      <AdminGate>
        <AdminPage categories={CATEGORIES} onBack={() => { window.location.hash = ""; }} />
      </AdminGate>
    );
  }

  return <Store />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
